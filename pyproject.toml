[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geopente"
version = "0.1.0"
description = "Mini projet : pentes d'un MNT synthétique (rasterio + geopandas) et carte Leaflet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "geopandas>=1.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geopente = "geopente.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
